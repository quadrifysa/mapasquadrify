<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Filiados — Uriel Biazin | Quadrify</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:#0a0f1c;
      --card:rgba(255,255,255,0.03);
      --blue:#3b82f6;
      --cyan:#38bdf8;
      --text:#e2e8f0;
      --glow:rgba(59,130,246,0.4);
    }

    * {
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body {
      font-family:'Inter',sans-serif;
      background:radial-gradient(circle at top left,var(--bg),#000);
      color:var(--text);
      padding:2rem;
      min-height:100vh;
    }

    .pagina {
      max-width:1080px;
      margin:2rem auto;
      padding:2.5rem 3rem;
      background:var(--card);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:20px;
      backdrop-filter:blur(30px);
      box-shadow:0 0 30px var(--glow);
      position:relative;
      animation:fi .9s ease-out;
    }

    @keyframes fi {
      from {
        opacity:0;
        transform:translateY(30px);
      }
      to {
        opacity:1;
        transform:translateY(0);
      }
    }

    h1 {
      font-size:2.8rem;
      text-align:center;
      margin-bottom:1rem;
      color:var(--cyan);
    }

    h2 {
      font-size:1.4rem;
      text-align:center;
      color:#94a3b8;
      margin-bottom:2.5rem;
    }

    h3 {
      font-size:1.3rem;
      color:var(--blue);
      border-bottom:1px solid var(--blue);
      margin:2rem 0 1rem;
      padding-bottom:.4rem;
    }

    p {
      margin:.4rem 0;
      font-size:1rem;
    }

    .fotos {
      display:flex;
      justify-content:space-between;
      gap:2rem;
      flex-wrap:wrap;
    }

    .foto-e {
      width:200px;
      border-radius:16px;
      border:2px solid var(--cyan);
      box-shadow:0 0 20px var(--glow);
    }

    .foto-d {
      width:220px;
      border-radius:16px;
      border:2px solid var(--cyan);
      box-shadow:0 0 20px var(--glow);
    }

    .logo {
      position:absolute;
      bottom:20px;
      right:20px;
      width:100px;
      opacity:.8;
    }

    .btn {
      display:inline-block;
      background:var(--blue);
      color:white;
      padding:.55rem 1.2rem;
      border-radius:6px;
      font-weight:600;
      text-decoration:none;
      font-size:.95rem;
      box-shadow:0 2px 6px rgba(0,0,0,.3);
    }

    @media(max-width:768px) {
      body {
        padding:1rem;
      }

      .pagina {
        padding:1.5rem;
      }

      .fotos {
        flex-direction:column;
        align-items:center;
      }

      h1 {
        font-size:2.1rem;
      }
    }
  </style>
</head>
